<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaite Texts Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&family=Frank+Ruhl+Libre:wght@400;500;700&family=Taamey+Frank+CLM&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="#" onclick="showHome(); return false;">
                <span class="brand-he">מרכז הלימוד היהודי הקראי</span>
                <span class="brand-en">Karaite Learning</span>
            </a>
        </div>
        <div class="nav-links">
            <a href="#" onclick="showTanakh(); return false;">Tanakh</a>
            <a href="#" onclick="showCategory('Liturgy'); return false;">Liturgy</a>
            <a href="#" onclick="showCategory('Halakhah'); return false;">Halakhah</a>
            <a href="#" onclick="showCategory('Commentary'); return false;">Commentary</a>
            <a href="#" onclick="showCategory('all'); return false;">All Texts</a>
        </div>
        <div class="nav-search">
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="Search texts..." autocomplete="off">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="M21 21l-4.35-4.35"/>
                </svg>
                <div id="searchResults" class="search-results"></div>
            </div>
        </div>
        <div class="nav-controls">
            <button id="darkModeToggle" class="icon-btn" title="Toggle dark mode">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"/>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                </svg>
            </button>
        </div>
    </nav>

    <main id="app">
        <!-- Content loaded dynamically -->
    </main>

    <footer class="footer">
        <p>Karaite Jewish Learning Center</p>
        <p class="footer-note">
            <a href="#" onclick="showChangelog(); return false;">What's New</a>
            · Preserving and sharing Karaite heritage since 2024
        </p>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/chat-widget.js"></script>
</body>
</html>
